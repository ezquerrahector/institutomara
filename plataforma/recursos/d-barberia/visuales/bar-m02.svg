<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Pelo, barba y piel: lo que necesitas saber antes de tocar una cabeza</title><rect width="800" height="584" rx="24" fill="#e9ebef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a2b">MÓDULO 2 · PELO, BARBA Y PIEL: LO QUE NECESITAS SABER ANTES DE </text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a2b">1. Cómo crece el pelo de la cabeza y de la barba: ciclo,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a2b">grosor, remolinos y tipos de pelo</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a2b">2. La piel de la cara y del cuello: irritación,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1a2b">foliculitis y granitos por rasurado</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a2b">3. Cuándo no atender y a quién canalizar: tiña, piojos,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1a2b">heridas, lunares que cambian y caída del pelo</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a2b">4. La consulta y la ficha del cliente: alergias,</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1a2b">medicamentos, consentimiento y datos personales</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#1E3A5F"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — Un sábado de consultas en una</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">barbería de Monterrey</text></svg>