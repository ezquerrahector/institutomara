<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Barba, afeitado clásico y estética masculina</title><rect width="800" height="584" rx="24" fill="#e9ebef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a2b">MÓDULO 6 · BARBA, AFEITADO CLÁSICO Y ESTÉTICA MASCULINA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a2b">1. Diseño de barba y bigote: líneas de mejilla y cuello,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a2b">simetría y mantenimiento</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a2b">2. El afeitado clásico con toalla caliente: preparación,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1a2b">pasadas y cierre</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a2b">3. Piel propensa a granitos e irritación: alternativas al</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1a2b">rasurado al ras y cuándo enviar al dermatólogo</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a2b">4. Tinte de canas y barba, cejas y limpieza facial básica:</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1a2b">prueba de alergia y plan ante reacciones</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#1E3A5F"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — Lanzamiento del servicio de</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">barba en una barbería de Cancún</text></svg>