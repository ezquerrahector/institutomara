<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Tu barbería: el oficio, el mercado y tu propuesta</title><rect width="800" height="584" rx="24" fill="#e9ebef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a2b">MÓDULO 1 · TU BARBERÍA: EL OFICIO, EL MERCADO Y TU PROPUESTA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a2b">1. El oficio de barbero en México: datos, mitos y lo que</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a2b">de verdad pide</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a2b">2. Formación, práctica presencial y certificación: qué</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1a2b">respalda tu trabajo</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a2b">3. Tu menú de servicios y tu cliente ideal: tiempos,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1a2b">combinaciones y especialidad</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a2b">4. Silla en renta, a domicilio, en casa o local: elegir tu</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1a2b">modalidad con números y riesgos</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#1E3A5F"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Una barbería de barrio para</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">señores y niños en Aguascalientes</text></svg>