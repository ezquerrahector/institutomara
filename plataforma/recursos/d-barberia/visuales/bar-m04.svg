<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Herramientas, cuerpo y fundamentos del corte</title><rect width="800" height="584" rx="24" fill="#e9ebef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a2b">MÓDULO 4 · HERRAMIENTAS, CUERPO Y FUNDAMENTOS DEL CORTE</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a2b">1. Máquinas, cuchillas, guardas, patilleras y tijeras:</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a2b">elegir, ajustar y mantener</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a2b">2. Tu cuerpo es tu herramienta: postura, altura de la</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1a2b">silla, pausas y cuidado de las manos</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a2b">3. Fundamentos del corte: secciones, líneas guía,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1a2b">elevación y tijera sobre peine</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a2b">4. La consulta de diseño: forma del rostro y de la cabeza,</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1a2b">estilo de vida y expectativas realistas</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#1E3A5F"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — Preparar la estación y las</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">consultas de un sábado en una barbería familiar de León</text></svg>