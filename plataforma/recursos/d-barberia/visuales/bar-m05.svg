<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Cortes masculinos y degradados</title><rect width="800" height="584" rx="24" fill="#e9ebef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a2b">MÓDULO 5 · CORTES MASCULINOS Y DEGRADADOS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a2b">1. Cortes clásicos con máquina y tijera: casquete, corte</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a2b">corto con textura y largo arriba</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a2b">2. El degradado bajo, medio y alto: zonas, transición y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1a2b">cómo corregir escalones</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a2b">3. Contornos, nuca, patillas y diseños: precisión sin</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1a2b">lastimar la piel</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a2b">4. Pelo rizado y afro, niños y adultos mayores, y el</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1a2b">peinado final que el cliente pueda repetir</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#1E3A5F"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Sábado de correcciones en una</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">barbería de Mexicali</text></svg>