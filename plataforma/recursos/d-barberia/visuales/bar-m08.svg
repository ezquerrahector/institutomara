<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Clientela, permisos y proyecto final</title><rect width="800" height="560" rx="24" fill="#e9ebef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a2b">MÓDULO 8 · CLIENTELA, PERMISOS Y PROYECTO FINAL</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a2b">1. Portafolio y redes: fotos propias, permiso del cliente</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a2b">y publicidad veraz</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a2b">2. La experiencia que hace volver: trato, ambiente</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1a2b">respetuoso, fidelidad y el barbero como aliado de la salud</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a2b">3. Permisos para abrir: aviso sanitario, licencia</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1a2b">municipal, uso de suelo y protección civil básica</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a2b">4. Crecer sin perder calidad: estándares escritos,</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1a2b">aprendices y venta de productos</text><rect x="36" y="464" width="728" height="58" rx="14" fill="#1E3A5F"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Plan de apertura de tu barbería</text></svg>