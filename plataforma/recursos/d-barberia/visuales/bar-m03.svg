<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Bioseguridad en la barbería: limpiar, desinfectar y desechar</title><rect width="800" height="584" rx="24" fill="#e9ebef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a2b">MÓDULO 3 · BIOSEGURIDAD EN LA BARBERÍA: LIMPIAR, DESINFECTAR Y </text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a2b">1. Por qué la higiene es tu primer servicio: hepatitis,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a2b">hongos y lo que dice la evidencia</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a2b">2. Máquinas, cuchillas, peines y tijeras: el protocolo</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1a2b">entre un cliente y otro</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a2b">3. La navaja: hoja nueva en cada cliente, contenedor</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1a2b">rígido y qué hacer ante un corte</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a2b">4. Toallas, capas, tira de cuello, superficies y residuos:</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1a2b">el cierre del día</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#1E3A5F"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Auditar la higiene de una</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">barbería de tres sillas en Culiacán</text></svg>