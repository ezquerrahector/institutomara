<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Números de la barbería: costo, precio, agenda y equipo</title><rect width="800" height="584" rx="24" fill="#e9ebef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a2b">MÓDULO 7 · NÚMEROS DE LA BARBERÍA: COSTO, PRECIO, AGENDA Y EQUI</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a2b">1. El costo real de cada servicio: tiempo de silla,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a2b">material y gastos fijos en Excel</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a2b">2. Precio, paquetes y membresías: cuánto cobrar y cuántos</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1a2b">servicios necesitas al mes</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a2b">3. Agenda, turnos sin cita, inasistencias, precios a la</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1a2b">vista y propinas</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a2b">4. Trabajar con más barberos: sueldo, comisión o renta de</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1a2b">silla, IMSS y obligaciones básicas</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#1E3A5F"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — Los números de una barbería</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">de dos sillas en Tlaxcala</text></svg>