<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580"><title>Control, influencia e incertidumbre</title><rect width="800" height="580" rx="24" fill="#EDF5F3"/><text x="32" y="45" font-size="23" font-family="sans-serif" fill="#234846">MÓDULO 2 · GUÍA DE DECISIONES</text><rect x="26" y="72" width="748" height="108" rx="12" fill="white"/><text x="48" y="106" font-family="sans-serif" font-size="22" fill="#234846">1. Lo que depende de tu elección</text><rect x="26" y="194" width="748" height="108" rx="12" fill="white"/><text x="48" y="228" font-family="sans-serif" font-size="22" fill="#234846">2. Influir sin confundirlo con controlar</text><rect x="26" y="316" width="748" height="108" rx="12" fill="white"/><text x="48" y="350" font-family="sans-serif" font-size="22" fill="#234846">3. Reservas y planes alternativos</text><rect x="26" y="438" width="748" height="108" rx="12" fill="white"/><text x="48" y="472" font-family="sans-serif" font-size="22" fill="#234846">4. Evaluar decisiones sin juzgarlas sólo por el</text><text x="48" y="500" font-family="sans-serif" font-size="22" fill="#234846">resultado</text></svg>