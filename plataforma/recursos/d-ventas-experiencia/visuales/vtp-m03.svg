<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>La conversación de descubrimiento</title><rect width="800" height="512" rx="24" fill="#f8eee6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#512504">MÓDULO 3 · LA CONVERSACIÓN DE DESCUBRIMIENTO</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#512504">1. Preparar la reunión y abrir con una agenda clara</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#512504">2. Preguntas de situación, problema, implicación y</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#512504">necesidad</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#512504">3. Escucha activa y diagnóstico: resumir, confirmar y</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#512504">cuantificar el problema en pesos</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#512504">4. Aportar una perspectiva nueva sin imponerla</text><rect x="36" y="416" width="728" height="58" rx="14" fill="#B45309"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — La flotilla que se descompone</text></svg>