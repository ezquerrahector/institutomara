<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Proveedores y compras</title><rect width="800" height="584" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 4 · PROVEEDORES Y COMPRAS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Mapa de proveedores: preventa, mayorista, central de</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">abasto y club de precio</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Negociar con proveedores: días de visita, crédito,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">devoluciones y notas de crédito</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Cuándo y cuánto pedir: punto de reorden y pedido</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#093a1b">sugerido en Excel</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">4. Refrigeradores y exhibidores en comodato: lee antes de</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#093a1b">firmar</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#15803D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — Compras de una tienda en</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">Culiacán</text></svg>