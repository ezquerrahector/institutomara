<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Operar en regla y con seguridad</title><rect width="800" height="560" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 7 · OPERAR EN REGLA Y CON SEGURIDAD</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Lo que tu tienda necesita en regla: licencia municipal,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">protección civil, aviso de funcionamiento y SAT</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Productos con reglas especiales: tabaco, alcohol,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">vapeadores y básculas</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Seguridad: manejo de efectivo, robos y extorsiones</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#093a1b">4. Tu equipo: contratar, capacitar y dejar la tienda en</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">buenas manos</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#15803D"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — Una tienda en regla en San</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">Luis Potosí</text></svg>