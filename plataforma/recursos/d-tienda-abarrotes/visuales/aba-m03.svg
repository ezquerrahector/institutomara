<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Precios con margen real</title><rect width="800" height="584" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 3 · PRECIOS CON MARGEN REAL</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Fijar precios por categoría: márgenes objetivo, precio</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">sugerido y productos gancho</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Impuestos en el precio: IVA a tasa 0 % y 16 %, IEPS</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">incluido y precio total a la vista</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Promociones que no regalan tu margen: paquetes, volumen</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#093a1b">y precios redondos</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">4. Competir con cadenas y mayoristas sin entrar en guerra</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#093a1b">de precios</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#15803D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Precios de una tienda frente</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">a una cadena en Querétaro</text></svg>