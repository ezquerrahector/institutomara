<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Merma, cobro digital y fiado</title><rect width="800" height="560" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 6 · MERMA, COBRO DIGITAL Y FIADO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Medir la merma: caducidad, daño, robo y errores de</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">registro</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Reducir la merma sin tratar a todos como sospechosos</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#093a1b">3. Cobrar con tarjeta, transferencia, CoDi y DiMo: costo y</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">control de cada forma</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#093a1b">4. El fiado con reglas: límites, registro y cobro</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">respetuoso</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#15803D"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — Merma, terminal y fiado en</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">Xalapa</text></svg>