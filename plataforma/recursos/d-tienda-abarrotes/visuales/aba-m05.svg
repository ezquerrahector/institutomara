<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Inventario sin sorpresas</title><rect width="800" height="584" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 5 · INVENTARIO SIN SORPRESAS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Recibir y acomodar: revisar el pedido, primeras</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">entradas, primeras salidas y cadena de frío</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Contar sin cerrar la tienda: conteos cíclicos y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">diferencias de inventario</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Rotación y días de inventario: dinero parado en el</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#093a1b">anaquel</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">4. Caducidades: semáforo de fechas, liquidar a tiempo y</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#093a1b">donar con orden</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#15803D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Inventario de una tienda en</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">Aguascalientes</text></svg>