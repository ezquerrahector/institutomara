<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Tu tienda en números: diagnóstico de partida</title><rect width="800" height="584" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 1 · TU TIENDA EN NÚMEROS: DIAGNÓSTICO DE PARTIDA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. La tienda de barrio en México: datos, competencia y tu</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">ventaja de cercanía</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Margen y aumento: cuánto te deja de verdad cada peso</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">que vendes</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Ticket promedio, clientes por día y horas pico: mide</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#093a1b">antes de cambiar</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">4. Corte de caja y dinero separado: tu sueldo, los gastos</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#093a1b">de la tienda y los de tu casa</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#15803D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Las cuentas de una miscelánea</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">en Pachuca</text></svg>