<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Hacer crecer tu tienda</title><rect width="800" height="560" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 8 · HACER CRECER TU TIENDA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Exhibición y acomodo: que el cliente encuentre y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">descubra</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Clientes que regresan: servicio, pedidos por WhatsApp y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">entrega a domicilio</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Tablero mensual: los indicadores que miras cada mes</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#093a1b">(incluye ahorro de luz con refrigeradores)</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">4. Crecer con cabeza: ampliar, pasar a minisúper o abrir</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#093a1b">otra sucursal y tu plan de 90 días</text><rect x="36" y="464" width="728" height="58" rx="14" fill="#15803D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Plan de rentabilidad de tu tienda</text></svg>