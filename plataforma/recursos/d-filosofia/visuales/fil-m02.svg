<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Grandes preguntas I: de Grecia al siglo XVIII</title><rect width="800" height="488" rx="24" fill="#ecedf2"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#1c2237">MÓDULO 2 · GRANDES PREGUNTAS I: DE GRECIA AL SIGLO XVIII</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#1c2237">1. Del mito al lógos: los presocráticos y Sócrates</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#1c2237">2. Platón y Aristóteles: dos maneras de buscar la verdad</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#1c2237">3. Fe y razón: filosofía medieval de tres tradiciones</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#1c2237">4. La modernidad: dudar, observar y atreverse a pensar</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#3E4C7A"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — La caverna y la duda en</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">tiempos de redes</text></svg>