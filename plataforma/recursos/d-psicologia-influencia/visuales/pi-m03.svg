<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" role="img"><title>Los principios de Cialdini I: reciprocidad, compromiso, prueba social y autoridad</title><rect width="800" height="464" rx="24" fill="#f2ebfd"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#381a6b">MÓDULO 3 · LOS PRINCIPIOS DE CIALDINI I: RECIPROCIDAD, COMPROMI</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#381a6b">1. Reciprocidad: el peso de lo que recibimos</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#381a6b">2. Compromiso y coherencia: cuando un sí lleva a otro</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#381a6b">3. Prueba social: lo que hacen los demás</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#381a6b">4. Autoridad: batas, credenciales y uniformes</text><rect x="36" y="368" width="728" height="58" rx="14" fill="#7C3AED"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — La feria de salud en la plaza</text></svg>