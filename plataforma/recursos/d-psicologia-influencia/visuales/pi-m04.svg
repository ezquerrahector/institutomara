<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Los principios de Cialdini II: simpatía, escasez, unidad y los límites de la evidencia</title><rect width="800" height="488" rx="24" fill="#f2ebfd"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#381a6b">MÓDULO 4 · LOS PRINCIPIOS DE CIALDINI II: SIMPATÍA, ESCASEZ, UN</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#381a6b">1. Simpatía: decimos que sí a quien nos cae bien</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#381a6b">2. Escasez: lo que se acaba parece valer más</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#381a6b">3. Unidad: el poder de ser «de los nuestros»</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#381a6b">4. Lo que sabemos y lo que no: límites de los principios</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#7C3AED"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — La campaña de la cooperativa</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">de miel</text></svg>