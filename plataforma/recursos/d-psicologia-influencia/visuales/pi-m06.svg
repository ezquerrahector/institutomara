<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>La fuerza del grupo: conformidad, obediencia, minorías y normas</title><rect width="800" height="536" rx="24" fill="#f2ebfd"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#381a6b">MÓDULO 6 · LA FUERZA DEL GRUPO: CONFORMIDAD, OBEDIENCIA, MINORÍ</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#381a6b">1. Conformidad: el experimento de Asch y lo que vino</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#381a6b">después</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#381a6b">2. Obediencia: Milgram, sus réplicas y sus críticas</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#381a6b">3. Cuando la minoría convence a la mayoría</text><rect x="36" y="320" width="728" height="82" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#381a6b">4. Normas sociales: lo que creemos que otros hacen y</text><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#381a6b">aprueban</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#7C3AED"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — La junta vecinal que nadie se</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">atreve a cuestionar</text></svg>