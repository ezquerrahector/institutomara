<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Dos formas de pensar: atajos mentales y sesgos</title><rect width="800" height="512" rx="24" fill="#f2ebfd"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#381a6b">MÓDULO 2 · DOS FORMAS DE PENSAR: ATAJOS MENTALES Y SESGOS</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#381a6b">1. Pensar rápido y pensar despacio</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#381a6b">2. El anclaje: el primer número que escuchas</text><rect x="36" y="224" width="728" height="82" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#381a6b">3. Disponibilidad y representatividad: lo que recuerdas y</text><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#381a6b">lo que parece</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#381a6b">4. Encuadre y aversión a la pérdida</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#7C3AED"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — El día de ofertas en la</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">tienda departamental</text></svg>