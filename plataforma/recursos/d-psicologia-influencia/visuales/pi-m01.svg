<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Fundamentos: qué es la influencia y cómo la estudia la ciencia</title><rect width="800" height="536" rx="24" fill="#f2ebfd"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#381a6b">MÓDULO 1 · FUNDAMENTOS: QUÉ ES LA INFLUENCIA Y CÓMO LA ESTUDIA </text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#381a6b">1. La influencia está en todas partes</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#381a6b">2. Cómo sabe la ciencia lo que sabe: experimentos y</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#381a6b">replicación</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#381a6b">3. Mitos populares sobre la influencia</text><rect x="36" y="320" width="728" height="82" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#381a6b">4. Tu laboratorio personal: observar la influencia en tu</text><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#381a6b">día</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#7C3AED"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Una mañana de influencias en</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">el mercado</text></svg>