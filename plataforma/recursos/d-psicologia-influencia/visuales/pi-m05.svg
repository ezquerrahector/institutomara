<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Cómo cambian las actitudes y las conductas</title><rect width="800" height="512" rx="24" fill="#f2ebfd"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#381a6b">MÓDULO 5 · CÓMO CAMBIAN LAS ACTITUDES Y LAS CONDUCTAS</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#381a6b">1. Dos rutas hacia el cambio de actitud</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#381a6b">2. Disonancia cognitiva: cuando lo que hago y lo que</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#381a6b">pienso no cuadran</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#381a6b">3. Resistencia y reactancia: por qué los datos no bastan</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#381a6b">4. De la intención a la conducta: hábitos y planes</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#7C3AED"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — La campaña de ahorro en la</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">fábrica</text></svg>