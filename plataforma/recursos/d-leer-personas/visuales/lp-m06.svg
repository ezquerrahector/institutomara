<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Señales verbales, voz, mensajes escritos y estilos</title><rect width="800" height="512" rx="24" fill="#e6f0f6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#012f48">MÓDULO 6 · SEÑALES VERBALES, VOZ, MENSAJES ESCRITOS Y ESTILOS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#012f48">1. Lo que la gente dice: palabras, repeticiones y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#012f48">omisiones</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#012f48">2. Cómo lo dice: la voz y los mensajes escritos</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#012f48">3. Lo no verbal como pregunta, no como respuesta</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#012f48">4. Estilos de comunicación y de decisión</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#0369A1"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — Pistas cruzadas en un equipo</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">remoto</text></svg>