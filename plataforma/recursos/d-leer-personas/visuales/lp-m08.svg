<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Relaciones cercanas, crisis y ética: integrar el método</title><rect width="800" height="512" rx="24" fill="#e6f0f6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#012f48">MÓDULO 8 · RELACIONES CERCANAS, CRISIS Y ÉTICA: INTEGRAR EL MÉT</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#012f48">1. Pareja y familia: la trampa de creer que ya conoces al</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#012f48">otro</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#012f48">2. Adolescentes: comprender sin invadir</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#012f48">3. Personas en crisis: escuchar, proteger y canalizar</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#012f48">4. La ética de leer a las personas y tu forma de practicar</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#0369A1"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Tu proyecto para comprender a una</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">persona importante</text></svg>