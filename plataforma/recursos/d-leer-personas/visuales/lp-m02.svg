<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Los sesgos que distorsionan cómo juzgamos a otros</title><rect width="800" height="560" rx="24" fill="#e6f0f6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#012f48">MÓDULO 2 · LOS SESGOS QUE DISTORSIONAN CÓMO JUZGAMOS A OTROS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#012f48">1. El error fundamental de atribución: ¿es la persona o es</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#012f48">la situación?</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#012f48">2. Primeras impresiones y efecto halo</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#012f48">3. Estereotipos y proyección: cuando vemos a un grupo o a</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#012f48">nosotros mismos</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#012f48">4. Sesgo de confirmación: buscar la prueba que te</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#012f48">contradiga</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#0369A1"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — Un proceso de selección bajo</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">la lupa</text></svg>