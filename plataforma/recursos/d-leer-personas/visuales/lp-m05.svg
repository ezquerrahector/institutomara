<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Conversaciones que verifican: escucha, preguntas, parafraseo y validación</title><rect width="800" height="536" rx="24" fill="#e6f0f6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#012f48">MÓDULO 5 · CONVERSACIONES QUE VERIFICAN: ESCUCHA, PREGUNTAS, PA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#012f48">1. Escucha activa: escuchar para comprender, no para</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#012f48">responder</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#012f48">2. Preguntas que abren: abiertas, de seguimiento y sin</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#012f48">trampa</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#012f48">3. Parafrasear y resumir: comprobar que entendiste</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#012f48">4. Validar emociones sin darle la razón en todo</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#0369A1"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Una conversación difícil en</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">la clínica veterinaria</text></svg>