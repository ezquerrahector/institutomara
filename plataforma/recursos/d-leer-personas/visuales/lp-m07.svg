<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Grupos, poder y relaciones de trabajo</title><rect width="800" height="512" rx="24" fill="#e6f0f6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#012f48">MÓDULO 7 · GRUPOS, PODER Y RELACIONES DE TRABAJO</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#012f48">1. Leer un grupo: roles, normas y silencios</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#012f48">2. El poder cambia la mirada: cuando tú estás arriba</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#012f48">3. Clientes: leer lo que esperan, no sólo lo que piden</text><rect x="36" y="296" width="728" height="82" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#012f48">4. Tu jefe también es una persona: leer expectativas y</text><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#012f48">prioridades</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#0369A1"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — Dos equipos que se vuelven</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">uno</text></svg>