<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Fundamentos: qué significa leer a una persona</title><rect width="800" height="584" rx="24" fill="#e6f0f6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#012f48">MÓDULO 1 · FUNDAMENTOS: QUÉ SIGNIFICA LEER A UNA PERSONA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#012f48">1. Leer a alguien no es adivinar: el método de las cuatro</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#012f48">fases</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#012f48">2. Qué tan buenos somos: la investigación sobre precisión</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#012f48">empática</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#012f48">3. Teoría de la mente: cómo imaginamos lo que pasa en otra</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#012f48">cabeza</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#012f48">4. Ponerse en los zapatos del otro no basta: obtener su</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#012f48">perspectiva</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#0369A1"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Un malentendido en una tienda</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">familiar</text></svg>