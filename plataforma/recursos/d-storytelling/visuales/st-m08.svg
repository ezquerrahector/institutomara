<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Escribir, revisar y contar con ética</title><rect width="800" height="488" rx="24" fill="#f9ece7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#571d05">MÓDULO 8 · ESCRIBIR, REVISAR Y CONTAR CON ÉTICA</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#571d05">1. El primer borrador: escribir antes de corregir</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#571d05">2. Revisar: cortar, leer en voz alta y probar con lectores</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#571d05">3. Ética del storytelling: no inventar, no manipular</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#571d05">4. Contar historias de otros con dignidad</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#C2410C"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Tu historia que conecta, de principio a</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">fin</text></svg>