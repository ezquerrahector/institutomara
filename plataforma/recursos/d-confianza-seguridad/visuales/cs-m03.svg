<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Mentalidad, impostor, perfeccionismo y comparación</title><rect width="800" height="512" rx="24" fill="#faf3e6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#5b3e02">MÓDULO 3 · MENTALIDAD, IMPOSTOR, PERFECCIONISMO Y COMPARACIÓN</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#5b3e02">1. Mentalidad de crecimiento: lo que sí y lo que no</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#5b3e02">2. Síndrome del impostor: cuando el éxito no se siente</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#5b3e02">tuyo</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#5b3e02">3. Perfeccionismo: estándares altos sin castigo</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#5b3e02">4. Comparación social y redes: mirar sin perderte</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#CA8A04"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — La nueva gerente que no se</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">siente gerente</text></svg>