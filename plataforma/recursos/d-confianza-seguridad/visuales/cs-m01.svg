<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Fundamentos: qué es (y qué no es) la confianza</title><rect width="800" height="536" rx="24" fill="#faf3e6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#5b3e02">MÓDULO 1 · FUNDAMENTOS: QUÉ ES (Y QUÉ NO ES) LA CONFIANZA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#5b3e02">1. Confianza, autoestima y autoeficacia: tres cosas</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#5b3e02">distintas</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#5b3e02">2. Las cuatro fuentes de la autoeficacia</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#5b3e02">3. Autoestima realista: lo que la investigación desmiente</text><rect x="36" y="320" width="728" height="82" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#5b3e02">4. El ciclo de la inseguridad: evitar alivia hoy y cobra</text><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#5b3e02">mañana</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#CA8A04"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — La promoción que nadie quiere</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">tomar</text></svg>