<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Asertividad: pedir, decir que no y poner límites</title><rect width="800" height="488" rx="24" fill="#faf3e6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#5b3e02">MÓDULO 5 · ASERTIVIDAD: PEDIR, DECIR QUE NO Y PONER LÍMITES</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#5b3e02">1. Asertividad: ni tapete ni aplanadora</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#5b3e02">2. Pedir y decir que no sin culpa excesiva</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#5b3e02">3. Límites: definir, comunicar y sostener</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#5b3e02">4. Recibir críticas y elogios sin derrumbarte</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#CA8A04"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — La hermana que siempre dice</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">que sí</text></svg>