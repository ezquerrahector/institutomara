<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Decidir, fallar y actuar según tus valores</title><rect width="800" height="512" rx="24" fill="#faf3e6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#5b3e02">MÓDULO 7 · DECIDIR, FALLAR Y ACTUAR SEGÚN TUS VALORES</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#5b3e02">1. Decidir con incertidumbre: suficientemente bueno es</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#5b3e02">suficiente</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#5b3e02">2. Fracasar bien: separar la decisión del resultado</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#5b3e02">3. Resiliencia: lo que sí es y lo que no</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#5b3e02">4. Valores y acción comprometida</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#CA8A04"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — La tienda que cerró y las dos</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">ofertas</text></svg>