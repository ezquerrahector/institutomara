<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Paul Ekman: emociones, rostro y microexpresiones</title><rect width="800" height="560" rx="24" fill="#ebecee"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#191d24">MÓDULO 2 · PAUL EKMAN: EMOCIONES, ROSTRO Y MICROEXPRESIONES</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#191d24">1. Ekman y las emociones básicas: lo que encontró y el</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#191d24">debate actual</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#191d24">2. FACS: el mapa de los músculos del rostro</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#191d24">3. Microexpresiones: lo que son y lo que la evidencia</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#191d24">muestra</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#191d24">4. De leer una emoción a sospechar una mentira: el salto</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#191d24">que no debes dar</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#374151"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — El taller de entrenamiento</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">que prometía demasiado</text></svg>