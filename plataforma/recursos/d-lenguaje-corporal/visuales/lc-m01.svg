<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Fundamentos: lo que comunicas sin palabras</title><rect width="800" height="488" rx="24" fill="#e7f1f1"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#073532">MÓDULO 1 · FUNDAMENTOS: LO QUE COMUNICAS SIN PALABRAS</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#073532">1. Qué es la comunicación no verbal y por qué importa</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#073532">2. El mapa de los canales no verbales</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#073532">3. Cómo trabajan juntas las palabras y el cuerpo</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#073532">4. No existe un diccionario de gestos: el mito del 7-38-55</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#0F766E"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Primera auditoría no verbal</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">en el trabajo</text></svg>