<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>La voz: paralenguaje, ritmo y pausas</title><rect width="800" height="560" rx="24" fill="#e7f1f1"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#073532">MÓDULO 5 · LA VOZ: PARALENGUAJE, RITMO Y PAUSAS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#073532">1. Las cualidades de la voz: tono, volumen, velocidad y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#073532">timbre</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#073532">2. Pausas y ritmo: el poder del silencio</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#073532">3. La voz al hablar en público: respiración, proyección y</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#073532">cuidado</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#073532">4. La voz sin imagen: llamadas, audios y atención</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#073532">telefónica</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#0F766E"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — La voz en una jornada de</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">atención</text></svg>