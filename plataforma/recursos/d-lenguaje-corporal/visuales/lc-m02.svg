<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Kinésica: postura, gestos y movimiento</title><rect width="800" height="536" rx="24" fill="#e7f1f1"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#073532">MÓDULO 2 · KINÉSICA: POSTURA, GESTOS Y MOVIMIENTO</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#073532">1. Una postura estable, abierta y adecuada al contexto</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#073532">2. Los tipos de gestos: emblemas, ilustradores,</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#073532">reguladores y adaptadores</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#073532">3. Tus manos al hablar: gestos que ayudan a explicar y a</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#073532">pensar</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#073532">4. Brazos cruzados y otros mitos de la postura</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#0F766E"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — Preparar una exposición con</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">el cuerpo</text></svg>