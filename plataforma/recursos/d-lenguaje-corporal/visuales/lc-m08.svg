<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Integración: relaciones, culturas, confianza y tu plan de práctica</title><rect width="800" height="536" rx="24" fill="#e7f1f1"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#073532">MÓDULO 8 · INTEGRACIÓN: RELACIONES, CULTURAS, CONFIANZA Y TU PL</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#073532">1. Lo no verbal en pareja y en familia</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#073532">2. Diferencias culturales: comunicarte con personas de</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#073532">otros lugares</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#073532">3. Posturas de poder y confianza: lo que sí y lo que no</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#073532">sabemos</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#073532">4. Tu plan de práctica: grabarte, observar sin juzgar y</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#073532">pedir retroalimentación</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#0F766E"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Tu proyecto de comunicación no verbal</text></svg>