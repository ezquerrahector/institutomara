<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Víctimas, riesgos y medición del delito en México</title><rect width="800" height="536" rx="24" fill="#f2e8e8"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#390d0d">MÓDULO 5 · VÍCTIMAS, RIESGOS Y MEDICIÓN DEL DELITO EN MÉXICO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#390d0d">1. Victimología: de culpar a la víctima a reconocer sus</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#390d0d">derechos</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#390d0d">2. Factores de riesgo y de protección sin determinismo</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#390d0d">3. La ENVIPE y la cifra negra: medir lo que no se denuncia</text><rect x="36" y="320" width="728" height="82" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#390d0d">4. Registros oficiales: incidencia delictiva y cómo leer</text><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#390d0d">una cifra</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#7F1D1D"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Presentar un diagnóstico de</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">seguridad al cabildo</text></svg>