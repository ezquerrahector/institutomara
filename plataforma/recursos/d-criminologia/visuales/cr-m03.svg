<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Por qué unas personas delinquen y otras no</title><rect width="800" height="536" rx="24" fill="#f2e8e8"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#390d0d">MÓDULO 3 · POR QUÉ UNAS PERSONAS DELINQUEN Y OTRAS NO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#390d0d">1. Aprendizaje social: la conducta delictiva también se</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#390d0d">aprende</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#390d0d">2. Control social y autocontrol: Hirschi, Gottfredson y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#390d0d">Hirschi</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#390d0d">3. Etiquetamiento y criminología crítica</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#390d0d">4. Curso de vida: inicio, persistencia y desistimiento</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#7F1D1D"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Analizar una trayectoria en</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">un programa de reinserción</text></svg>