<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Qué es la criminología y qué no es</title><rect width="800" height="512" rx="24" fill="#f2e8e8"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#390d0d">MÓDULO 1 · QUÉ ES LA CRIMINOLOGÍA Y QUÉ NO ES</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#390d0d">1. Criminología, criminalística y psicología forense: tres</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#390d0d">miradas distintas</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#390d0d">2. Delito, desviación y control social</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#390d0d">3. Pensar con evidencia: mitos sobre el delito</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#390d0d">4. La criminología en México: campos de trabajo y límites</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#7F1D1D"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Asesorar un ciclo de charlas</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">en una biblioteca pública</text></svg>