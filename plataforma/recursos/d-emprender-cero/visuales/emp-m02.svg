<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Conocer a tu cliente antes de invertir</title><rect width="800" height="560" rx="24" fill="#f8eee6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#512504">MÓDULO 2 · CONOCER A TU CLIENTE ANTES DE INVERTIR</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#512504">1. Quién es tu cliente: segmentos y primeros clientes</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#512504">2. Entrevistas que no mienten: preguntar por el pasado, no</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#512504">por opiniones</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#512504">3. Mapa de la propuesta de valor: trabajos, frustraciones</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#512504">y alegrías</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#512504">4. Analizar lo que escuchaste: patrones, competencia y</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#512504">alternativas actuales</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#B45309"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — Entrevistas en el taller de</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">bicicletas</text></svg>