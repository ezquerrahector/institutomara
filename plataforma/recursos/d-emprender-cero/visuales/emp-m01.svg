<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Pensar como emprendedor: tú, tu punto de partida y tu oportunidad</title><rect width="800" height="536" rx="24" fill="#f8eee6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#512504">MÓDULO 1 · PENSAR COMO EMPRENDEDOR: TÚ, TU PUNTO DE PARTIDA Y T</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#512504">1. Emprender en México: lo que dicen los datos y los mitos</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#512504">que cuestan caro</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#512504">2. Empieza con lo que tienes: habilidades, contactos,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#512504">tiempo y pérdida asumible</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#512504">3. De problema a oportunidad: dónde buscar ideas que</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#512504">alguien pagaría</text><rect x="36" y="368" width="728" height="58" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#512504">4. Elegir una idea y escribir tus hipótesis</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#B45309"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Tres ideas y veinte mil pesos</text></svg>