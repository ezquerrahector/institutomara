<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Formalizar tu negocio paso a paso</title><rect width="800" height="584" rx="24" fill="#f8eee6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#512504">MÓDULO 7 · FORMALIZAR TU NEGOCIO PASO A PASO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#512504">1. Alta en el SAT: RFC, e.firma, régimen (RESICO) y lo que</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#512504">te toca</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#512504">2. Facturar y cobrar en regla: CFDI, factura global y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#512504">cobro digital</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#512504">3. Permisos municipales y sanitarios: uso de suelo,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#512504">licencia de funcionamiento, SARE, Protección Civil y aviso</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#512504">4. Protege tu negocio: marca en el IMPI, aviso de</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#512504">privacidad, reglas de Profeco y si contratas</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#B45309"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — El checklist de una papelería</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">en Saltillo</text></svg>