<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Dinero para empezar sin hundirte</title><rect width="800" height="536" rx="24" fill="#f8eee6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#512504">MÓDULO 6 · DINERO PARA EMPEZAR SIN HUNDIRTE</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#512504">1. Fuentes de dinero: ahorro, preventas, clientes,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#512504">familia, socios, tandas y crédito</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#512504">2. Crédito con cabeza: CAT, Condusef, capacidad de pago y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#512504">fraudes</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#512504">3. Separar el dinero del negocio y el de tu casa</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#512504">4. Socios: cuándo sí, cuándo no y qué dejar por escrito</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#B45309"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — El arranque de una</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">electricista en Toluca</text></svg>