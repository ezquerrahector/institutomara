<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Testimonio y memoria</title><rect width="800" height="560" rx="24" fill="#e9ebf3"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1a3e">MÓDULO 5 · TESTIMONIO Y MEMORIA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1a3e">1. La memoria reconstruye: falsos recuerdos y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1a3e">desinformación</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1a3e">2. Sugestionabilidad y entrevistas que contaminan</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#0e1a3e">3. Entrevistar a niñas, niños y adolescentes: el protocolo</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1a3e">NICHD</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#0e1a3e">4. Valorar un testimonio: análisis de contenido e</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1a3e">identificación</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#1E3A8A"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Revisar una entrevista a un</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">niño testigo</text></svg>