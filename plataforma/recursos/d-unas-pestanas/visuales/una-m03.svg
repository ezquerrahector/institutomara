<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Bioseguridad: limpiar, desinfectar y esterilizar</title><rect width="800" height="560" rx="24" fill="#f9e8ef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#560b2a">MÓDULO 3 · BIOSEGURIDAD: LIMPIAR, DESINFECTAR Y ESTERILIZAR</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#560b2a">1. Limpiar, desinfectar o esterilizar: el riesgo de cada</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#560b2a">herramienta decide</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#560b2a">2. Protocolo de mesa y de herramientas para cada servicio</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#560b2a">3. Pedicure seguro: tinas, rasurado, callos y pies que no</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#560b2a">se atienden</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#560b2a">4. Manos, guantes, superficies y residuos: el cierre del</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#560b2a">día</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#BE185D"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Ordenar la bioseguridad de un</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">estudio con tres técnicas en Chihuahua</text></svg>