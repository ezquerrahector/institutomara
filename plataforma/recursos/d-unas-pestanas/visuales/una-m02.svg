<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>La uña y la piel: anatomía, salud y cuándo no atender</title><rect width="800" height="584" rx="24" fill="#f9e8ef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#560b2a">MÓDULO 2 · LA UÑA Y LA PIEL: ANATOMÍA, SALUD Y CUÁNDO NO ATENDE</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#560b2a">1. Anatomía de la uña y cómo crece: lo que necesitas saber</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#560b2a">antes de tocar una mano</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#560b2a">2. La cutícula es una barrera: preparar sin cortar de más</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#560b2a">ni lastimar</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#560b2a">3. Señales que piden médico: hongos, infecciones, manchas,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#560b2a">heridas y pies con diabetes</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#560b2a">4. La ficha de la clienta y la consulta previa: alergias,</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#560b2a">medicamentos y consentimiento</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#BE185D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — Una mañana de consultas</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">difíciles en un estudio de Mérida</text></svg>