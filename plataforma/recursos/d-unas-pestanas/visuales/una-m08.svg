<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Clientela, permisos y proyecto final</title><rect width="800" height="584" rx="24" fill="#f9e8ef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#560b2a">MÓDULO 8 · CLIENTELA, PERMISOS Y PROYECTO FINAL</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#560b2a">1. Portafolio honesto y redes: fotos propias, permiso de</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#560b2a">la clienta y publicidad veraz</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#560b2a">2. Experiencia, retención y reseñas: que la clienta</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#560b2a">regrese y te recomiende</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#560b2a">3. Permisos para abrir: aviso sanitario, licencia</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#560b2a">municipal, uso de suelo y protección civil básica</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#560b2a">4. Crecer sin perder calidad: estándares escritos,</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#560b2a">capacitación y venta de productos</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#BE185D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Plan de apertura de tu estudio de uñas</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">y pestañas</text></svg>