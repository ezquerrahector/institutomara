<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Alergias y seguridad química para ti y tu clienta</title><rect width="800" height="584" rx="24" fill="#f9e8ef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#560b2a">MÓDULO 5 · ALERGIAS Y SEGURIDAD QUÍMICA PARA TI Y TU CLIENTA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#560b2a">1. Alergia a los acrilatos: cómo se produce y cómo</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#560b2a">prevenirla en cada servicio</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#560b2a">2. Lámparas UV y LED: lo que dice la evidencia y cómo</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#560b2a">usarlas</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#560b2a">3. Vapores, polvo, ventilación y tu cuerpo: cuidar tu</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#560b2a">salud en el oficio</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#560b2a">4. Etiquetas, sustancias prohibidas y proveedores: comprar</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#560b2a">sin poner en riesgo a nadie</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#BE185D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Auditoría química de un</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">estudio que cambia de dueña en Zacatecas</text></svg>