<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Tu estudio de belleza: el oficio, el mercado y tu propuesta</title><rect width="800" height="584" rx="24" fill="#f9e8ef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#560b2a">MÓDULO 1 · TU ESTUDIO DE BELLEZA: EL OFICIO, EL MERCADO Y TU PR</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#560b2a">1. El negocio de la belleza en México: datos, mitos y lo</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#560b2a">que de verdad pide el oficio</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#560b2a">2. Formación, práctica presencial y certificación: qué</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#560b2a">respalda tu trabajo</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#560b2a">3. Tu menú de servicios y tu clienta ideal: tiempos,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#560b2a">combinaciones y especialidad</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#560b2a">4. A domicilio, en casa, renta de cabina o local: elegir</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#560b2a">tu modalidad con números y riesgos</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#BE185D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — La propuesta de un estudio de</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">uñas para personas mayores en Puebla</text></svg>