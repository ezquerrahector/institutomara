<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Pestañas y cejas: técnica segura y reacciones</title><rect width="800" height="584" rx="24" fill="#f9e8ef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#560b2a">MÓDULO 6 · PESTAÑAS Y CEJAS: TÉCNICA SEGURA Y REACCIONES</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#560b2a">1. Extensiones de pestañas: anatomía, adhesivo,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#560b2a">aislamiento y peso</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#560b2a">2. Consulta, prueba de parche y contraindicaciones en</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#560b2a">servicios de ojos</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#560b2a">3. Lifting y tinte de pestañas y cejas: química, riesgos y</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#560b2a">protocolo</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#560b2a">4. Reacciones, retiro, mantenimiento y mitos: qué hacer</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#560b2a">cuando algo sale mal</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#BE185D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — El primer sábado de un</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">estudio de pestañas en San Luis Potosí</text></svg>