<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Sistemas de uñas: química, técnica y retiro seguro</title><rect width="800" height="584" rx="24" fill="#f9e8ef"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#560b2a">MÓDULO 4 · SISTEMAS DE UÑAS: QUÍMICA, TÉCNICA Y RETIRO SEGURO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#560b2a">1. La química que usas: acrílico, gel, polygel, dip y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#560b2a">semipermanente</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#560b2a">2. Preparación de la uña natural: limado, deshidratación y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#560b2a">adherencia sin adelgazar</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#560b2a">3. Elegir el sistema y mantenerlo: rellenos,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#560b2a">levantamientos y quiebres</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#560b2a">4. Retiro seguro y descanso de la uña: lo que nunca se</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#560b2a">arranca</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#BE185D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — Técnica y retiro por servicio</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">para un estudio nuevo en Culiacán</text></svg>