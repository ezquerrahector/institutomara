<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Indicadores y análisis que responden preguntas</title><rect width="800" height="536" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 4 · INDICADORES Y ANÁLISIS QUE RESPONDEN PREGUNTAS</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. KPI bien definidos (y la ley de Goodhart)</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#063441">2. Medidas sobre el modelo de datos: tablas dinámicas y</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">DAX básico</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#063441">3. Comparar con justicia: tasas, metas, mezcla y periodos</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#063441">equivalentes</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#063441">4. Segmentar para encontrar dónde actuar: Pareto, cohortes</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#063441">y embudos</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#0E7490"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — Los honorarios del despacho</text></svg>