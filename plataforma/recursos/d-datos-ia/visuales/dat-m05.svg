<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Estadística para decidir sin engañarte</title><rect width="800" height="512" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 5 · ESTADÍSTICA PARA DECIDIR SIN ENGAÑARTE</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Más allá del promedio: dispersión, percentiles y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#063441">atípicos</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">2. Muestras, margen de error e intervalos</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#063441">3. Correlación no es causalidad</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#063441">4. Experimentos y pruebas A/B en el negocio</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Las renovaciones que nadie</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">entendía</text></svg>