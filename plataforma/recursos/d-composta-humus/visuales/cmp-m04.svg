<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Otros abonos y su uso seguro</title><rect width="800" height="560" rx="24" fill="#f0edea"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#302413">MÓDULO 4 · OTROS ABONOS Y SU USO SEGURO</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#302413">1. Bocashi: fermentación, receta y lo que sí sabemos de él</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#302413">2. Lixiviados y tés de composta: usos y riesgos de</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#302413">patógenos</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#302413">3. Estiércoles: tipos, riesgos sanitarios y cómo</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#302413">compostarlos bien</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#302413">4. Dosis y aplicación: recomendar a tu cliente sin</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#302413">prometer cosechas</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#6B4F2A"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — Abonos en un rancho de</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">Zacatecas</text></svg>