<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>La ciencia del compostaje</title><rect width="800" height="584" rx="24" fill="#f0edea"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#302413">MÓDULO 2 · LA CIENCIA DEL COMPOSTAJE</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#302413">1. Microorganismos y fases: mesófila, termófila,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#302413">enfriamiento y maduración</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#302413">2. La receta: verdes, cafés y relación carbono/nitrógeno</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#302413">en Excel</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#302413">3. Humedad, aire y tamaño de partícula: la prueba del puño</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#302413">y los olores como diagnóstico</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#302413">4. Temperatura e higienización: termómetro, bitácora y</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#302413">volteos</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#6B4F2A"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — La pila que no calienta en</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">Querétaro</text></svg>