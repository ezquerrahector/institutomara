<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Lombricultura</title><rect width="800" height="560" rx="24" fill="#f0edea"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#302413">MÓDULO 3 · LOMBRICULTURA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#302413">1. La lombriz roja californiana: biología y condiciones</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#302413">que necesita</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#302413">2. Montar camas y contenedores: sustrato, precomposteo y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#302413">densidad inicial</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#302413">3. Alimentar y cuidar: qué sí, qué no y cómo resolver</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#302413">problemas</text><rect x="36" y="368" width="728" height="58" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#302413">4. Cosechar humus y lombriz, cribar y escalar</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#6B4F2A"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Lombrices en una azotea de</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">Guadalajara</text></svg>