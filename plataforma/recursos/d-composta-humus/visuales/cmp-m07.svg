<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Costos, precio y escala en Excel</title><rect width="800" height="584" rx="24" fill="#f0edea"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#302413">MÓDULO 7 · COSTOS, PRECIO Y ESCALA EN EXCEL</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#302413">1. Inversión inicial: terreno, techo, herramientas, criba</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#302413">y empaque</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#302413">2. Costo por kilo y por bulto: rendimiento, mano de obra y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#302413">merma de masa</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#302413">3. Precio, margen y punto de equilibrio con dos fuentes de</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#302413">ingreso: venta y recolección</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#302413">4. Escalar: pilas volteadas, aireación forzada o</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#302413">lombricultura</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#6B4F2A"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — Los números de una planta en</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">Aguascalientes</text></svg>