<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Insumos, logística y permisos</title><rect width="800" height="560" rx="24" fill="#f0edea"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#302413">MÓDULO 6 · INSUMOS, LOGÍSTICA Y PERMISOS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#302413">1. Conseguir residuos: acuerdos con restaurantes, hoteles,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#302413">comedores y mercados</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#302413">2. Recolección, transporte y separación en origen</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#302413">3. Permisos: residuos de manejo especial, uso de suelo y</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#302413">licencias</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#302413">4. Vecinos, ambiente y salud de tu equipo: olores,</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#302413">lixiviados, fauna y bioaerosoles</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#6B4F2A"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — Residuos de un mercado en</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">Mérida</text></svg>