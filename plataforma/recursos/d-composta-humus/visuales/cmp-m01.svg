<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>El negocio de los abonos orgánicos</title><rect width="800" height="560" rx="24" fill="#f0edea"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#302413">MÓDULO 1 · EL NEGOCIO DE LOS ABONOS ORGÁNICOS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#302413">1. De residuo a recurso: los residuos orgánicos en México</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#302413">y el negocio de cerrar el ciclo</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#302413">2. Tus productos: composta, humus de lombriz, lixiviado,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#302413">bocashi y sustratos</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#302413">3. Quién compra y quién paga: viveros, huertos,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#302413">agricultores, paisajismo, municipios y empresas</text><rect x="36" y="368" width="728" height="58" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#302413">4. Mitos, límites y seguridad desde el primer día</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#6B4F2A"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Una idea de composta en</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">Texcoco</text></svg>