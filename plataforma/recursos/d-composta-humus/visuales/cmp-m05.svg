<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Calidad, normas y etiquetado</title><rect width="800" height="584" rx="24" fill="#f0edea"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#302413">MÓDULO 5 · CALIDAD, NORMAS Y ETIQUETADO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#302413">1. Madurez y estabilidad: pruebas caseras y prueba de</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#302413">germinación</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#302413">2. La NMX-AA-180-SCFI-2018: tipos de composta, parámetros</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#302413">e higienización</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#302413">3. El humus de lombriz (NMX-FF-109-SCFI-2008) y el</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#302413">análisis de laboratorio: muestrear y leer el informe</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#302413">4. Registro, etiqueta y la palabra «orgánico»: lo que</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#302413">puedes y no puedes decir</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#6B4F2A"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — La primera venta con ficha</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">técnica en Puebla</text></svg>