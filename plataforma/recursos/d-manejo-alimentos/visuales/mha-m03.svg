<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Higiene personal: las manos que tocan la comida</title><rect width="800" height="584" rx="24" fill="#e7f1f1"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#073532">MÓDULO 3 · HIGIENE PERSONAL: LAS MANOS QUE TOCAN LA COMIDA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#073532">1. Lavado de manos: cuándo, cómo y los mitos del gel y los</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#073532">guantes</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#073532">2. Uniforme, presentación y conductas en el área de</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#073532">alimentos</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#073532">3. Salud del personal: síntomas que excluyen y política de</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#073532">enfermos</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#073532">4. Capacitar al equipo: inducción, charla de turno y</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#073532">registro anual</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#0F766E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Temporada alta en la cocina</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">de un hotel de Cancún</text></svg>