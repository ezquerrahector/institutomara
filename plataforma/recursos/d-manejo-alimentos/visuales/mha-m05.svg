<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Del proveedor al almacén</title><rect width="800" height="488" rx="24" fill="#e7f1f1"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#073532">MÓDULO 5 · DEL PROVEEDOR AL ALMACÉN</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#073532">1. Proveedores y recepción: aceptar o rechazar</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#073532">2. Almacenamiento seco y orden del refrigerador</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#073532">3. Refrigeración, congelación y descongelación</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#073532">4. Fechas, etiquetas internas y vida útil</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#0F766E"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Una mañana de recepción en un</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">hospital de Guadalajara</text></svg>