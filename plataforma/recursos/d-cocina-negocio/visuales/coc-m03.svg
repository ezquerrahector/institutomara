<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Técnica con criterio: por qué funcionan las recetas</title><rect width="800" height="560" rx="24" fill="#f9ece7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#571d05">MÓDULO 3 · TÉCNICA CON CRITERIO: POR QUÉ FUNCIONAN LAS RECETAS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#571d05">1. La ciencia de la repostería: harina, azúcar, grasa,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#571d05">huevo y leudantes</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#571d05">2. Cocina salada para vender: métodos de cocción, bases y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#571d05">sazón medida</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#571d05">3. Producción por lotes y mise en place</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#571d05">4. Control de calidad: prueba sensorial, defectos y</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#571d05">bitácora</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#C2410C"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Un sábado de pedidos en</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">Hermosillo</text></svg>