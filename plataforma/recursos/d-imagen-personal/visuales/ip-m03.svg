<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Cuerpo, proporciones y ajuste sin juicios</title><rect width="800" height="488" rx="24" fill="#f8eee6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#512504">MÓDULO 3 · CUERPO, PROPORCIONES Y AJUSTE SIN JUICIOS</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#512504">1. Mirar el cuerpo con ojos de diseño</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#512504">2. Proporciones: cortes, largos y tiros</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#512504">3. Telas, caída y patrones</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#512504">4. El ajuste manda: talla, sastre y cuerpos cambiantes</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#B45309"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Proporciones para una clienta</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">con evento</text></svg>