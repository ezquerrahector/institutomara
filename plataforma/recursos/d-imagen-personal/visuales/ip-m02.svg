<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Colorimetría: tus colores, paso a paso</title><rect width="800" height="512" rx="24" fill="#f8eee6"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#512504">MÓDULO 2 · COLORIMETRÍA: TUS COLORES, PASO A PASO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#512504">1. Las propiedades del color: tono, valor, intensidad y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#512504">temperatura</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#512504">2. Tus rasgos de color: subtono, profundidad y contraste</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#512504">3. El sistema de estaciones: herramienta útil con límites</text><rect x="36" y="320" width="728" height="82" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#512504">4. Tu paleta práctica: neutros, colores cerca del rostro y</text><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#512504">acentos</text><rect x="36" y="416" width="728" height="58" rx="14" fill="#B45309"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — Sesión de prueba de color</text></svg>