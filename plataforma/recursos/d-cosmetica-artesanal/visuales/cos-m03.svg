<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Jabón artesanal I: química, sosa cáustica y cálculo</title><rect width="800" height="584" rx="24" fill="#f2efec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#37291c">MÓDULO 3 · JABÓN ARTESANAL I: QUÍMICA, SOSA CÁUSTICA Y CÁLCULO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#37291c">1. La saponificación: grasa más sosa es jabón y glicerina</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#37291c">(frío, caliente y base glicerinada)</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#37291c">2. Manejo seguro de la sosa cáustica: equipo, orden,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#37291c">almacenamiento y primeros auxilios</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#37291c">3. Calcular la lejía: valores de saponificación,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#37291c">sobreengrasado y agua en Excel</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#37291c">4. Diseñar tu receta: qué aporta cada aceite y cómo</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#37291c">equilibrar dureza, espuma y suavidad</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#7A5C3E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — Revisar la receta de jabón de</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">una maestra antes de su primer lote</text></svg>