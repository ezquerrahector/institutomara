<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Costos, precio, canales y proyecto final</title><rect width="800" height="584" rx="24" fill="#f2efec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#37291c">MÓDULO 8 · COSTOS, PRECIO, CANALES Y PROYECTO FINAL</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#37291c">1. El costo real de cada pieza en Excel: materias primas,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#37291c">envase, etiqueta, merma y tu tiempo</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#37291c">2. Precio de menudeo, mayoreo y consignación, y punto de</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#37291c">equilibrio</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#37291c">3. Canales de venta: bazares y ferias, tiendas, regalos</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#37291c">corporativos y venta en línea con fotos y descripciones</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#37291c">4. Crecer sin perder calidad: estándares escritos, marca</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#37291c">en el IMPI, maquila y tu plan de 90 días</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#7A5C3E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Plan de lanzamiento de tu marca de</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">cosmética artesanal</text></svg>