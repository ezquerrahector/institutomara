<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Vender en regla: etiqueta, promesas, permisos y lotes</title><rect width="800" height="584" rx="24" fill="#f2efec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#37291c">MÓDULO 7 · VENDER EN REGLA: ETIQUETA, PROMESAS, PERMISOS Y LOTE</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#37291c">1. La etiqueta de tu cosmético elemento por elemento</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#37291c">(NOM-141)</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#37291c">2. Lo que puedes y no puedes prometer: propiedades</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#37291c">terapéuticas, «natural», «orgánico» y publicidad veraz</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#37291c">3. Permisos y obligaciones: aviso de funcionamiento,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#37291c">buenas prácticas (NOM-259), municipio y SAT</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#37291c">4. Control de lotes, quejas y retiro de producto: tu</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#37291c">sistema de calidad en una libreta (o una hoja de cálculo)</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#7A5C3E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — Auditoría de una marca antes</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">de entrar a una tienda en Xalapa</text></svg>