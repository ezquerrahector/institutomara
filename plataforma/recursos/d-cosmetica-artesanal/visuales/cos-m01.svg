<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Tu marca de cosmética artesanal: el oficio, el mercado y el taller</title><rect width="800" height="584" rx="24" fill="#f2efec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#37291c">MÓDULO 1 · TU MARCA DE COSMÉTICA ARTESANAL: EL OFICIO, EL MERCA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#37291c">1. La cosmética artesanal en México: datos, mitos y lo que</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#37291c">de verdad pide</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#37291c">2. Jabones, velas, bálsamos y cremas: cuatro productos,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#37291c">cuatro riesgos distintos</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#37291c">3. Tu línea inicial y tu cliente ideal: empezar con pocos</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#37291c">productos bien hechos</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#37291c">4. Tu taller en casa: espacio, utensilios exclusivos,</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#37291c">báscula, bitácora y reglas de seguridad</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#7A5C3E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Una línea y un taller para</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">empezar en Querétaro</text></svg>