<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Aromas y velas con seguridad</title><rect width="800" height="584" rx="24" fill="#f2efec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#37291c">MÓDULO 6 · AROMAS Y VELAS CON SEGURIDAD</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#37291c">1. Aceites esenciales y fragancias: diluciones,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#37291c">fototoxicidad, alérgenos, IFRA y quién debe evitarlos</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#37291c">2. Ceras y mechas: parafina, soya, abeja y coco, y lo que</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#37291c">dice la evidencia sobre emisiones</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#37291c">3. Hacer una vela de contenedor: temperaturas, carga de</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#37291c">fragancia, curado y prueba de quemado</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#37291c">4. Seguridad y etiqueta de la vela: incendios,</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#37291c">advertencias y la NOM-050</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#7A5C3E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — Lanzamiento de una vela</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">navideña en Ciudad Obregón</text></svg>