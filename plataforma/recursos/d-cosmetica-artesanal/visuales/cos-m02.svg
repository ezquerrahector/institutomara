<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>La piel, los ingredientes y la formulación en porcentajes</title><rect width="800" height="584" rx="24" fill="#f2efec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#37291c">MÓDULO 2 · LA PIEL, LOS INGREDIENTES Y LA FORMULACIÓN EN PORCEN</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#37291c">1. La piel y su manto ácido: lo que un cosmético puede y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#37291c">no puede hacer</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#37291c">2. Conocer tus ingredientes: aceites, mantecas, ceras,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#37291c">nombres INCI y fichas del proveedor</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#37291c">3. Formular en peso y en porcentajes: la fórmula al 100 %</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#37291c">y escalar lotes en Excel</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#37291c">4. Natural no significa seguro: alérgenos, sustancias</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#37291c">prohibidas o restringidas y mitos frecuentes</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#7A5C3E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — De cucharadas a gramos: la</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">fórmula de un bálsamo en Monterrey</text></svg>