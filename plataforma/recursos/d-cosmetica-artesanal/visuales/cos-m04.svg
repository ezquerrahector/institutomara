<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Jabón artesanal II: elaboración, curado y calidad</title><rect width="800" height="584" rx="24" fill="#f2efec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#37291c">MÓDULO 4 · JABÓN ARTESANAL II: ELABORACIÓN, CURADO Y CALIDAD</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#37291c">1. El proceso en frío paso a paso: temperaturas, traza,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#37291c">moldes y aditivos</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#37291c">2. Curado, corte y pH: por qué esperar, cómo medir y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#37291c">cuándo un jabón no se vende</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#37291c">3. Defectos y soluciones: ceniza blanca, gotas, manchas</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#37291c">naranjas, separación y aceleración por fragancia</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#37291c">4. Base glicerinada, colorantes y exfoliantes:</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#37291c">alternativas sin sosa y sus límites</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#7A5C3E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — Diagnosticar cuatro lotes con</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">defectos y decidir qué sale a la venta</text></svg>