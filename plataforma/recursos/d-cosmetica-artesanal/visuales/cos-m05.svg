<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Bálsamos, cremas y conservación</title><rect width="800" height="584" rx="24" fill="#f2efec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#37291c">MÓDULO 5 · BÁLSAMOS, CREMAS Y CONSERVACIÓN</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#37291c">1. Productos anhidros: bálsamos, mantecas batidas, aceites</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#37291c">corporales y exfoliantes</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#37291c">2. Emulsiones: fase acuosa, fase oleosa y emulsionante;</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#37291c">cómo se hace una crema</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#37291c">3. Conservantes: por qué todo lo que lleva agua los</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#37291c">necesita y por qué la vitamina E no lo es</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#37291c">4. Estabilidad, vida útil y envase: pruebas caseras,</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#37291c">laboratorio, caducidad y PAO</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#7A5C3E"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Una crema casera frente a su</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">primera tienda en Cuernavaca</text></svg>