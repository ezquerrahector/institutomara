<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Prejuicio, estereotipos y relaciones entre grupos</title><rect width="800" height="536" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 6 · PREJUICIO, ESTEREOTIPOS Y RELACIONES ENTRE GRUPOS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Estereotipos, prejuicio y discriminación: tres cosas</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">distintas</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Nosotros y ellos: identidad social y favoritismo de</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">grupo</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. La amenaza del estereotipo: una idea influyente con</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#093a1b">matices de réplica</text><rect x="36" y="368" width="728" height="58" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">4. Lo que sí reduce el prejuicio: contacto bien diseñado</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#15803D"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — La fusión de dos sucursales</text></svg>