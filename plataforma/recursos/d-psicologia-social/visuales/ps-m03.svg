<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Actitudes, disonancia y conformidad</title><rect width="800" height="560" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 3 · ACTITUDES, DISONANCIA Y CONFORMIDAD</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Lo que pienso y lo que hago: cuándo las actitudes</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">predicen la conducta</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Disonancia cognitiva: cuando cambiamos de opinión para</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">justificar lo que hicimos</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Conformidad: Asch, sus réplicas y lo que de verdad</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#093a1b">mostró</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">4. Por qué nos ajustamos al grupo: información, aceptación</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#093a1b">e ignorancia pluralista</text><rect x="36" y="464" width="728" height="58" rx="14" fill="#15803D"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — La asamblea de la cooperativa</text></svg>