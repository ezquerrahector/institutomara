<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Ayudar y no ayudar: el efecto espectador y la conducta prosocial</title><rect width="800" height="536" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 5 · AYUDAR Y NO AYUDAR: EL EFECTO ESPECTADOR Y LA CONDUC</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. El efecto espectador: Darley, Latané y los cinco pasos</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">para ayudar</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Lo que muestran las cámaras: en la calle, casi siempre</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">alguien ayuda</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Por qué ayudamos: empatía, prisa y la felicidad de dar</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#093a1b">4. Cómo intervenir con seguridad: las cinco D y la ayuda</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#093a1b">en México</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#15803D"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Una noche en el transporte</text></svg>