<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>El yo en el mundo social</title><rect width="800" height="512" rx="24" fill="#e8f2ec"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#093a1b">MÓDULO 1 · EL YO EN EL MUNDO SOCIAL</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#093a1b">1. Qué estudia la psicología social y por qué no es sólo</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#093a1b">sentido común</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#093a1b">2. Te conoces a través de los demás: autoconcepto y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#093a1b">comparación social</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#093a1b">3. Autoestima: lo que sí hace, lo que no y cómo cuidarla</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#093a1b">4. El efecto reflector y los sesgos a favor de uno mismo</text><rect x="36" y="416" width="728" height="58" rx="14" fill="#15803D"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — La nueva en la oficina</text></svg>