<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Hacer y mantener amistades en la vida adulta</title><rect width="800" height="512" rx="24" fill="#fdeee7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#692805">MÓDULO 5 · HACER Y MANTENER AMISTADES EN LA VIDA ADULTA</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#692805">1. Cuántas horas cuesta una amistad</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#692805">2. Tus círculos de amistad: lo que sí y lo que no dice el</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#692805">número de Dunbar</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#692805">3. Le caíste mejor de lo que crees: la brecha de agrado</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#692805">4. Mantener amistades cuando la vida adulta las aleja</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#EA580C"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — El grupo de amigos que se</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">está deshaciendo</text></svg>