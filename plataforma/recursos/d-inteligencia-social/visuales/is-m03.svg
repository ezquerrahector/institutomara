<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Primeras conversaciones y charla ligera con método</title><rect width="800" height="512" rx="24" fill="#fdeee7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#692805">MÓDULO 3 · PRIMERAS CONVERSACIONES Y CHARLA LIGERA CON MÉTODO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#692805">1. Por qué evitamos hablar con desconocidos (y por qué nos</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#692805">equivocamos)</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#692805">2. Abrir una conversación: el método APR</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#692805">3. Sostener y profundizar: de lo ligero a lo que importa</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#692805">4. Recordar nombres y cerrar con gracia</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#EA580C"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — La primera reunión del club</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">de lectura</text></svg>