<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>El carisma se entrena</title><rect width="800" height="512" rx="24" fill="#fdeee7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#692805">MÓDULO 2 · EL CARISMA SE ENTRENA</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#692805">1. Carisma: del don misterioso a las conductas observables</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#692805">2. Las tácticas carismáticas de Antonakis en tu vida</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#692805">diaria</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#692805">3. Presencia: atención completa en la persona que tienes</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#692805">enfrente</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#692805">4. Carisma con ética: brillar sin usar a nadie</text><rect x="36" y="416" width="728" height="58" rx="14" fill="#EA580C"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — La comida de la cooperativa</text></svg>