<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Preguntar, escuchar y reír juntos</title><rect width="800" height="560" rx="24" fill="#fdeee7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#692805">MÓDULO 4 · PREGUNTAR, ESCUCHAR Y REÍR JUNTOS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#692805">1. Preguntas de seguimiento: la forma más sencilla de caer</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#692805">bien</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#692805">2. Escuchar las buenas noticias: la respuesta activa y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#692805">constructiva</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#692805">3. Humor con cuidado: cuándo suma y cuándo resta</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#692805">4. Ni monólogo ni interrogatorio: el equilibrio de la</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#692805">conversación</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#EA580C"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — La cena de reencuentro de la</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">generación</text></svg>