<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Trabajo, clientes y dinero</title><rect width="800" height="512" rx="24" fill="#f8e8e8"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#530d0d">MÓDULO 6 · TRABAJO, CLIENTES Y DINERO</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#530d0d">1. Hablar con tu jefe: discrepar, pedir y negociar</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#530d0d">prioridades</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#530d0d">2. Con tus colaboradores: expectativas y desempeño</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#530d0d">3. Clientes molestos: escuchar, reparar y poner límites</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#530d0d">4. Hablar de dinero: cobrar, pedir y prestar</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#B91C1C"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — Un mal día en la tienda de</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">materiales</text></svg>