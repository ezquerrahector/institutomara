<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Escuchar y decir lo tuyo</title><rect width="800" height="512" rx="24" fill="#f8e8e8"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#530d0d">MÓDULO 4 · ESCUCHAR Y DECIR LO TUYO</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#530d0d">1. Escuchar para entender, no para responder</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#530d0d">2. Preguntas que abren y preguntas que acorralan</text><rect x="36" y="224" width="728" height="82" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#530d0d">3. Comunicación no violenta: observación, sentimiento,</text><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#530d0d">necesidad y petición</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#530d0d">4. Asertividad: decir lo tuyo sin atacar ni encogerte</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#B91C1C"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — La madre de familia que llegó</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">molesta</text></svg>