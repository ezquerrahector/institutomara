<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Mensajes difíciles: retroalimentación, malas noticias y límites</title><rect width="800" height="488" rx="24" fill="#f8e8e8"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#530d0d">MÓDULO 5 · MENSAJES DIFÍCILES: RETROALIMENTACIÓN, MALAS NOTICIA</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#530d0d">1. Dar retroalimentación difícil</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#530d0d">2. Recibir retroalimentación sin derrumbarte ni atacar</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#530d0d">3. Malas noticias con el protocolo SPIKES adaptado</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#530d0d">4. Decir no y poner límites</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#B91C1C"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Una semana de malas noticias</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">en la constructora</text></svg>