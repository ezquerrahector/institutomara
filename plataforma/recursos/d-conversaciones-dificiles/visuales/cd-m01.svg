<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Por qué evitamos las conversaciones que importan</title><rect width="800" height="584" rx="24" fill="#f8e8e8"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#530d0d">MÓDULO 1 · POR QUÉ EVITAMOS LAS CONVERSACIONES QUE IMPORTAN</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#530d0d">1. Qué hace difícil una conversación y cuánto cuesta</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#530d0d">evitarla</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#530d0d">2. Por qué tu mente prefiere evitar: amenaza, identidad y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#530d0d">emociones</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#530d0d">3. Las tres conversaciones: qué pasó, sentimientos e</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#530d0d">identidad</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#530d0d">4. Tu estilo bajo presión: silencio, ataque y lo que sí</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#530d0d">quieres hacer</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#B91C1C"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — El laboratorio dental donde</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">nadie dice nada</text></svg>