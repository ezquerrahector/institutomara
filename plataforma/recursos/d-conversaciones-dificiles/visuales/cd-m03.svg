<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Regularte y abrir la conversación</title><rect width="800" height="488" rx="24" fill="#f8e8e8"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#530d0d">MÓDULO 3 · REGULARTE Y ABRIR LA CONVERSACIÓN</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#530d0d">1. Regular tus emociones antes de hablar</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#530d0d">2. Cuando la emoción te desborda: inundación y pausas</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#530d0d">útiles</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#530d0d">3. Arranque suave y la tercera historia</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#530d0d">4. Mantener la conversación segura</text><rect x="36" y="392" width="728" height="58" rx="14" fill="#B91C1C"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 3 — La colegiatura que no se pagó</text></svg>