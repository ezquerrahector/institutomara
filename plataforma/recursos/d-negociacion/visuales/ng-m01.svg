<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Fundamentos: qué es negociar y cómo se crea y se reparte el valor</title><rect width="800" height="536" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 1 · FUNDAMENTOS: QUÉ ES NEGOCIAR Y CÓMO SE CREA Y SE REP</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Negociar no es pelear: qué es y qué mitos te frenan</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#063441">2. Negociación distributiva: cuando se reparte un pastel</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">fijo</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#063441">3. Negociación integrativa: cómo crecer el pastel antes de</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#063441">repartirlo</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#063441">4. Crear y reclamar valor: el dilema del negociador y tu</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#063441">estilo</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#0E7490"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Un horno para la panadería</text></svg>