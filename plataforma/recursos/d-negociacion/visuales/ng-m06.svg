<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Ética, faroles y tácticas duras</title><rect width="800" height="512" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 6 · ÉTICA, FAROLES Y TÁCTICAS DURAS</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Mentir, callar y blofear: dónde está la línea</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#063441">2. Regatear con justicia: mercados, oficios y reputación</text><rect x="36" y="224" width="728" height="82" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#063441">3. Tácticas duras I: policía bueno y malo, ultimátum y</text><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#063441">fecha límite falsa</text><rect x="36" y="320" width="728" height="82" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#063441">4. Tácticas duras II: mordisquito, autoridad limitada y</text><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#063441">cómo superar el no</text><rect x="36" y="416" width="728" height="58" rx="14" fill="#0E7490"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — Un departamento en preventa</text></svg>