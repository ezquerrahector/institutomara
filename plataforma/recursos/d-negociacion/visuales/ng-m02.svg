<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>El método de Harvard: negociar por principios</title><rect width="800" height="512" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 2 · EL MÉTODO DE HARVARD: NEGOCIAR POR PRINCIPIOS</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Separar a las personas del problema</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#063441">2. Intereses, no posiciones</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#063441">3. Inventar opciones de mutuo beneficio</text><rect x="36" y="296" width="728" height="82" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#063441">4. Criterios objetivos: decidir con algo más que la</text><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#063441">voluntad</text><rect x="36" y="392" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — Café de altura para una</text><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">cadena de cafeterías</text></svg>