<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Negociar en tu vida: sueldo, negocio, vivienda y familia</title><rect width="800" height="488" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 7 · NEGOCIAR EN TU VIDA: SUELDO, NEGOCIO, VIVIENDA Y FAM</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Negociar tu sueldo y tu aumento con datos</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#063441">2. Proveedores, clientes y compras: negociar en tu negocio</text><rect x="36" y="224" width="728" height="58" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#063441">3. Con el casero: renta, aumentos, reparaciones y depósito</text><rect x="36" y="296" width="728" height="58" rx="14" fill="white"/><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#063441">4. Negociar en familia y en pareja</text><rect x="36" y="368" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — Una oferta de trabajo y una</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">contraoferta</text></svg>