<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Tu audiencia, tu mensaje y la estructura</title><rect width="800" height="560" rx="24" fill="#f5e7eb"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#48081a">MÓDULO 4 · TU AUDIENCIA, TU MENSAJE Y LA ESTRUCTURA</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#48081a">1. Analizar a tu audiencia y la situación</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#48081a">2. Del tema al mensaje central: una idea que cabe en una</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#48081a">frase</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#48081a">3. Estructuras que ordenan: problema-solución, temas y la</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#48081a">regla de tres</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#48081a">4. La secuencia motivada de Monroe y el arte de abrir y</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#48081a">cerrar</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#9F1239"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — La propuesta del huerto</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">escolar</text></svg>