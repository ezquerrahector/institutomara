<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Tipos de discurso: de la clase al brindis</title><rect width="800" height="536" rx="24" fill="#f5e7eb"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#48081a">MÓDULO 7 · TIPOS DE DISCURSO: DE LA CLASE AL BRINDIS</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#48081a">1. Informar y enseñar: clases, capacitaciones y</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#48081a">explicaciones</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#48081a">2. Persuadir en el trabajo: el pitch de tres minutos y las</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#48081a">juntas</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#48081a">3. Videollamadas y entrevistas en medios</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#48081a">4. Discursos de ocasión: brindis, bodas, XV años,</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#48081a">graduaciones y homenajes</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#9F1239"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — La semana de Itzel</text></svg>