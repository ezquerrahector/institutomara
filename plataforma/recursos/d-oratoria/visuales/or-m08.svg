<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img"><title>Ensayo deliberado, comunidad y proyecto final</title><rect width="800" height="488" rx="24" fill="#f5e7eb"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#48081a">MÓDULO 8 · ENSAYO DELIBERADO, COMUNIDAD Y PROYECTO FINAL</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#48081a">1. Ensayo deliberado: practicar para mejorar, no sólo para</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#48081a">repetir</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#48081a">2. Grabarte y pedir retroalimentación útil</text><rect x="36" y="248" width="728" height="58" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#48081a">3. Asambleas, juntas vecinales y espacios comunitarios</text><rect x="36" y="320" width="728" height="58" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#48081a">4. Tu estilo propio y tu plan para seguir creciendo</text><rect x="36" y="392" width="728" height="58" rx="14" fill="#9F1239"/><text x="56" y="432" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Tu discurso final, de principio a fin</text></svg>