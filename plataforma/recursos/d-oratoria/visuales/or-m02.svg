<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img"><title>Manejar el miedo escénico con lo que sí funciona</title><rect width="800" height="512" rx="24" fill="#f5e7eb"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#48081a">MÓDULO 2 · MANEJAR EL MIEDO ESCÉNICO CON LO QUE SÍ FUNCIONA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#48081a">1. Respirar para bajar la activación: el poder de la</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#48081a">exhalación larga</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#48081a">2. Reevaluar los nervios: de «estoy nervioso» a «estoy</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#48081a">listo»</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#48081a">3. Exposición gradual: tu escalera para hablar en público</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#48081a">4. Antes, durante y después: tu rutina de presentación</text><rect x="36" y="416" width="728" height="58" rx="14" fill="#9F1239"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — El comité de portafolios</text></svg>