<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Catálogo que vende y que se encuentra</title><rect width="800" height="584" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 2 · CATÁLOGO QUE VENDE Y QUE SE ENCUENTRA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. La ficha de producto completa: título, atributos,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#063441">medidas e información comercial obligatoria</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">2. Fotos, video y descripciones honestas que reducen</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#063441">devoluciones</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#063441">3. Catálogo ordenado: SKU, variantes y códigos de barras</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#063441">en una hoja de cálculo</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#063441">4. Que te encuentren: palabras clave, categorías y</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#063441">búsqueda dentro del marketplace</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 2 — El catálogo de una tienda de</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">juguetes de madera en Oaxaca</text></svg>