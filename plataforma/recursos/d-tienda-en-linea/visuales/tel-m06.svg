<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Envíos, empaque e inventario multicanal</title><rect width="800" height="584" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 6 · ENVÍOS, EMPAQUE E INVENTARIO MULTICANAL</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Paqueterías y guías: tarifas, peso volumétrico,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#063441">cobertura y zonas extendidas</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">2. Empaque que protege y no encarece: caja, relleno,</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#063441">prueba de caída y presentación</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#063441">3. Inventario multicanal: existencias sincronizadas, stock</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#063441">de seguridad y cero sobreventas</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#063441">4. Promesa de entrega, seguimiento e incidencias:</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#063441">retrasos, daños y paquetes perdidos</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — Envíos e inventario de una</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">tienda de cerámica en Torreón</text></svg>