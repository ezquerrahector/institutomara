<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Tu modelo de venta en línea: canales y números por pedido</title><rect width="800" height="584" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 1 · TU MODELO DE VENTA EN LÍNEA: CANALES Y NÚMEROS POR P</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. El comercio electrónico en México: datos, mitos y qué</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#063441">sí se vende en línea</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">2. Tienda propia, marketplaces, redes y WhatsApp: elegir y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#063441">combinar canales sin depender de uno</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#063441">3. La utilidad real de cada pedido: comisión, cargo fijo,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#063441">pago, envío, empaque y devoluciones</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#063441">4. Tu nicho y tu catálogo inicial: qué vender, qué no</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#063441">vender y con qué proveedores</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Tres canales para las bolsas</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">de palma de una familia en Hermosillo</text></svg>