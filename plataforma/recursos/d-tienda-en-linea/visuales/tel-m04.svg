<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Vender en marketplaces: precio, reputación y logística de la plataforma</title><rect width="800" height="584" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 4 · VENDER EN MARKETPLACES: PRECIO, REPUTACIÓN Y LOGÍSTI</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Cómo funciona un marketplace: reglas, tipos de</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#063441">publicación y lo que no controlas</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">2. Precio por canal en Excel: comisión, cargo fijo, envío</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#063441">y utilidad neta</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#063441">3. Reputación, preguntas y reclamos: responder rápido y</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#063441">resolver mediaciones</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#063441">4. Almacén de la plataforma y anuncios dentro del</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#063441">marketplace: cuándo sí y cuándo no</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — Precio y reputación de una</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">tienda de refacciones para bicicleta en Chihuahua</text></svg>