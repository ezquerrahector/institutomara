<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Cobrar en línea sin sustos: formas de pago, fraudes y conciliación</title><rect width="800" height="584" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 5 · COBRAR EN LÍNEA SIN SUSTOS: FORMAS DE PAGO, FRAUDES </text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Formas de pago en línea: tarjeta, meses sin intereses,</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#063441">transferencia, efectivo en tiendas y contra entrega</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">2. Contracargos: por qué ocurren, cómo prevenirlos y cómo</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#063441">defenderte con evidencia</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#063441">3. Fraudes contra vendedores: comprobantes falsos,</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#063441">sobrepagos y falsos soportes</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#063441">4. Conciliar ventas y depósitos: comisiones, retenciones y</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#063441">dinero retenido</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Un fin de semana de pedidos</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">de una tienda de ropa de bebé en Morelia</text></svg>