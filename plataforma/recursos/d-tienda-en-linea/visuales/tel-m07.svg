<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>Devoluciones, garantías y reglas: Profeco y SAT</title><rect width="800" height="584" rx="24" fill="#e7f1f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#063441">MÓDULO 7 · DEVOLUCIONES, GARANTÍAS Y REGLAS: PROFECO Y SAT</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#063441">1. Derechos del consumidor en compras a distancia:</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#063441">información, precio total, arrepentimiento y garantías</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#063441">2. Tu política de devoluciones y cambios: clara, justa y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#063441">con su costo calculado</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#063441">3. Promociones, meses sin intereses, Buen Fin y reseñas:</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#063441">anunciar sin engañar</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#063441">4. Impuestos de vender en plataformas: retenciones de ISR</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#063441">e IVA, RFC y tu contador</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#0E7490"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — Políticas y promociones de</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">una tienda de mochilas en Toluca</text></svg>