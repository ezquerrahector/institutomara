<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Tácticas frecuentes II: percepción, triángulos y grupo</title><rect width="800" height="536" rx="24" fill="#ede8f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#220d43">MÓDULO 4 · TÁCTICAS FRECUENTES II: PERCEPCIÓN, TRIÁNGULOS Y GRU</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#220d43">1. Gaslighting: cuando te hacen dudar de tu realidad</text><rect x="36" y="152" width="728" height="58" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#220d43">2. Triangulación y aislamiento</text><rect x="36" y="224" width="728" height="82" rx="14" fill="white"/><text x="56" y="264" font-family="sans-serif" font-size="20" fill="#220d43">3. Doble vínculo, mensajes contradictorios y metas que se</text><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#220d43">mueven</text><rect x="36" y="320" width="728" height="82" rx="14" fill="white"/><text x="56" y="360" font-family="sans-serif" font-size="20" fill="#220d43">4. Presión de grupo: cuando todos empujan hacia el mismo</text><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#220d43">lado</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#4C1D95"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 4 — El comité de padres de</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">familia</text></svg>