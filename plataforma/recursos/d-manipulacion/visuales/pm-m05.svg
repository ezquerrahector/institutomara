<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Relaciones cercanas: pareja y familia</title><rect width="800" height="536" rx="24" fill="#ede8f4"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#220d43">MÓDULO 5 · RELACIONES CERCANAS: PAREJA Y FAMILIA</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#220d43">1. Control coercitivo: más allá de los golpes</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#220d43">2. Violencia psicológica y el ciclo de la violencia, con</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#220d43">matices</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#220d43">3. Manipulación en la familia: padres, hijos adultos y</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#220d43">personas mayores</text><rect x="36" y="344" width="728" height="58" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#220d43">4. Salir con seguridad: plan de seguridad y redes de apoyo</text><rect x="36" y="416" width="728" height="82" rx="14" fill="#4C1D95"/><text x="56" y="456" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Lo que Rosario no le cuenta a</text><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">nadie</text></svg>