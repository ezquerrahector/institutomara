<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Six Sigma I: definir y medir con datos</title><rect width="800" height="560" rx="24" fill="#e9ecf7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1d4f">MÓDULO 5 · SIX SIGMA I: DEFINIR Y MEDIR CON DATOS</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1d4f">1. Six Sigma y DMAIC: el proyecto, el acta y los roles</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#0e1d4f">2. Las siete herramientas básicas: hoja de verificación,</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1d4f">estratificación, Pareto, histograma y dispersión</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#0e1d4f">3. Estadística que sí vas a usar: tipos de datos, media,</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1d4f">desviación estándar y distribución normal en Excel</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#0e1d4f">4. ¿Puedes confiar en tu medición? Análisis del sistema de</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1d4f">medición (MSA) y R&amp;R</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#1E40AF"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 5 — Los resultados que no llegan</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">a tiempo</text></svg>