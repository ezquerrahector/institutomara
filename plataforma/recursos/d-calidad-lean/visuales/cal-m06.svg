<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Six Sigma II: control estadístico y capacidad del proceso</title><rect width="800" height="560" rx="24" fill="#e9ecf7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1d4f">MÓDULO 6 · SIX SIGMA II: CONTROL ESTADÍSTICO Y CAPACIDAD DEL PR</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1d4f">1. Variación común y especial: la lógica de las gráficas</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1d4f">de control</text><rect x="36" y="176" width="728" height="58" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1d4f">2. Gráficas X̄-R, I-MR y de atributos paso a paso en Excel</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#0e1d4f">3. Leer la gráfica sin sobrerreaccionar: reglas de</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1d4f">detección y el embudo de Deming</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#0e1d4f">4. Capacidad del proceso: Cp, Cpk, DPMO y nivel sigma sin</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1d4f">mitos</text><rect x="36" y="440" width="728" height="82" rx="14" fill="#1E40AF"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 6 — La inyectora que nadie deja</text><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">en paz</text></svg>