<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Integrar y sostener: tu proyecto de mejora</title><rect width="800" height="536" rx="24" fill="#e9ecf7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1d4f">MÓDULO 8 · INTEGRAR Y SOSTENER: TU PROYECTO DE MEJORA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1d4f">1. Analizar y mejorar en DMAIC: verificar causas con</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1d4f">datos, elegir soluciones y pilotear</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1d4f">2. Controlar para que no regrese: AMEF, plan de control y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1d4f">estandarización</text><rect x="36" y="272" width="728" height="58" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1d4f">3. Indicadores, gestión diaria y cultura de calidad</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#0e1d4f">4. Tu hoja de ruta: integrar Lean, Six Sigma e ISO,</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1d4f">presentar resultados y seguir creciendo</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#1E40AF"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Proyecto final — Tu proceso, de punta a punta</text></svg>