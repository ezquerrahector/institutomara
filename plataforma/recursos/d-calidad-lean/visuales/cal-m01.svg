<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img"><title>Calidad: qué es, cuánto cuesta y cómo se mejora</title><rect width="800" height="536" rx="24" fill="#e9ecf7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1d4f">MÓDULO 1 · CALIDAD: QUÉ ES, CUÁNTO CUESTA Y CÓMO SE MEJORA</text><rect x="36" y="80" width="728" height="58" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1d4f">1. Qué es calidad: del cliente al proceso</text><rect x="36" y="152" width="728" height="82" rx="14" fill="white"/><text x="56" y="192" font-family="sans-serif" font-size="20" fill="#0e1d4f">2. Lo que siguen enseñando Shewhart, Deming, Juran,</text><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1d4f">Ishikawa y Crosby</text><rect x="36" y="248" width="728" height="82" rx="14" fill="white"/><text x="56" y="288" font-family="sans-serif" font-size="20" fill="#0e1d4f">3. El costo de la mala calidad: prevención, evaluación y</text><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1d4f">fallas (calcularlo en Excel)</text><rect x="36" y="344" width="728" height="82" rx="14" fill="white"/><text x="56" y="384" font-family="sans-serif" font-size="20" fill="#0e1d4f">4. Pensar en procesos: SIPOC, mapa de proceso y cómo</text><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1d4f">encajan Lean, Six Sigma e ISO 9001</text><rect x="36" y="440" width="728" height="58" rx="14" fill="#1E40AF"/><text x="56" y="480" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 1 — Rechazos en la curtiduría</text></svg>