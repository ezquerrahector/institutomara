<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>ISO 9001:2026 y auditoría interna</title><rect width="800" height="584" rx="24" fill="#e9ecf7"/><text x="36" y="50" font-family="sans-serif" font-size="22" fill="#0e1d4f">MÓDULO 7 · ISO 9001:2026 Y AUDITORÍA INTERNA</text><rect x="36" y="80" width="728" height="82" rx="14" fill="white"/><text x="56" y="120" font-family="sans-serif" font-size="20" fill="#0e1d4f">1. ISO 9001:2026 y la infraestructura de la calidad en</text><text x="56" y="144" font-family="sans-serif" font-size="20" fill="#0e1d4f">México</text><rect x="36" y="176" width="728" height="82" rx="14" fill="white"/><text x="56" y="216" font-family="sans-serif" font-size="20" fill="#0e1d4f">2. Contexto, liderazgo, cultura de calidad, riesgos y</text><text x="56" y="240" font-family="sans-serif" font-size="20" fill="#0e1d4f">oportunidades e información documentada</text><rect x="36" y="272" width="728" height="82" rx="14" fill="white"/><text x="56" y="312" font-family="sans-serif" font-size="20" fill="#0e1d4f">3. Operación, no conformidades, acción correctiva y</text><text x="56" y="336" font-family="sans-serif" font-size="20" fill="#0e1d4f">revisión por la dirección</text><rect x="36" y="368" width="728" height="82" rx="14" fill="white"/><text x="56" y="408" font-family="sans-serif" font-size="20" fill="#0e1d4f">4. Auditoría interna con ISO 19011: planear, recoger</text><text x="56" y="432" font-family="sans-serif" font-size="20" fill="#0e1d4f">evidencia y redactar hallazgos</text><rect x="36" y="464" width="728" height="82" rx="14" fill="#1E40AF"/><text x="56" y="504" font-family="sans-serif" font-size="20" fill="white">★ Laboratorio del módulo 7 — La imprenta que prepara su</text><text x="56" y="528" font-family="sans-serif" font-size="20" fill="white">transición</text></svg>